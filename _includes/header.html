<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">Umar <span>Ahmad</span></a>

    <button class="icon-btn nav-toggle" id="navToggle" aria-expanded="false" aria-controls="siteNav" aria-label="Open menu">
      {% include icon.html name="menu" %}
    </button>

    <nav class="nav" id="siteNav" aria-label="Main">
      {%- assign nav = site.data.nav -%}
      {% for item in nav %}
        <a href="{{ item.url | relative_url }}"
           {% if page.url == item.url %}aria-current="page"{% endif %}
           {% if item.external %}target="_blank" rel="noopener"{% endif %}>{{ item.title }}</a>
      {% endfor %}
      <button class="icon-btn" id="themeToggle" aria-label="Switch colour theme" title="Switch colour theme">
        <span data-theme-icon="light">{% include icon.html name="moon" size=18 %}</span>
        <span data-theme-icon="dark" hidden>{% include icon.html name="sun" size=18 %}</span>
      </button>
    </nav>
  </div>
</header>

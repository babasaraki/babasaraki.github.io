---
layout: default
---
<section>
  <div class="wrap">
    {% if page.eyebrow %}<div class="eyebrow">{{ page.eyebrow }}</div>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.lead %}<p class="muted" style="font-size:1.08rem;max-width:62ch">{{ page.lead }}</p>{% endif %}
  </div>
</section>
<section style="padding-top:0">
  <div class="wrap">{{ content }}</div>
</section>

---
layout: default
---
<article>
  <section>
    <div class="wrap prose">
      <div class="eyebrow">{{ page.date | date: "%e %B %Y" }}{% if page.tags.size > 0 %} · {{ page.tags | join: " · " }}{% endif %}</div>
      <h1>{{ page.title }}</h1>
      {% if page.description %}<p class="muted" style="font-size:1.08rem">{{ page.description }}</p>{% endif %}
      <hr>
      {{ content }}
      <hr>
      <p class="small muted">
        Written by {{ site.data.profile.name }}.
        <a href="{{ '/blog/' | relative_url }}">More writing</a> ·
        <a href="{{ site.data.profile.links | where: 'name','Substack' | map: 'url' | first }}" target="_blank" rel="noopener">Substack</a>
      </p>
    </div>
  </section>
</article>

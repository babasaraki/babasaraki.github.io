# ---------------------------------------------------------------------------
# Journal quartiles — the ONLY place the site reads Q1/Q2/Q3/Q4 from.
#
# Fill in `quartile:` for each journal from SCImago (scimagojr.com) or the
# Scopus/JCR source you prefer, using the BEST quartile across that journal's
# subject categories, and set `category:` to the category that quartile came
# from. Leave `quartile:` empty and the article simply renders without a badge.
#
# `citedness` is the OpenAlex 2-year mean citedness, shown here only to help
# you work down the list fastest-first. It is NOT used to infer a quartile.
#
# Re-check annually; SJR republishes each spring.
# ---------------------------------------------------------------------------
